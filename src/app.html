<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <script>
      (function () {
        try {
          var stored = localStorage.theme;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="twitter:image" content="/pre.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samuel Teshale Terefe — AI / ML Engineering" />
    <meta
      name="twitter:description"
      content="Samuel Teshale Terefe — AI Engineer, ML Engineer, Data Scientist, Deep Learning Engineer, and LLM & RAG Engineer."
    />
    <meta name="twitter:url" content="https://www.linkedin.com/in/samuel-teshale-219326396/" />

    <meta
      property="description"
      content="Samuel Teshale Terefe — AI Engineer, ML Engineer, Data Scientist, Deep Learning Engineer, and LLM & RAG Engineer."
    />
    <meta property="og:image" content="/pre.png" />
    <meta property="og:title" content="Samuel Teshale Terefe — AI / ML Engineering" />
    <meta
      property="og:description"
      content="Samuel Teshale Terefe — AI Engineer, ML Engineer, Data Scientist, Deep Learning Engineer, and LLM & RAG Engineer."
    />
    

    <title>Samuel Teshale Terefe — AI / ML Engineering</title>
  </head>

  <body data-sveltekit-preload-data="hover" class="relative">
    <svg class="absolute">
      <filter id="grain">
        <feTurbulence type="turbulence" baseFrequency="0.69" />
      </filter>
    </svg>

    <div style="display: contents">%sveltekit.body%</div>
  </body>

  <style>
    body {
      position: relative;
    }

    body::before,
    body::after {
      position: absolute;
      filter: url(#grain);
      left: 0;
      top: 0;
      content: '';
      width: 100%;
      height: 100%;
      z-index: 9999;
      opacity: 18%;
      filter: contrast(150%) brightness(300%);
      pointer-events: none;
    }

    body::before {
      filter: url(#grain);
    }
  </style>
</html>
